[package]
name = "spike-probe"
description = "Runs the spike's checks over the corpus and writes the report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "probe"

[[bin]]
name = "probe"
path = "src/main.rs"

[[bin]]
name = "rar-one"
path = "src/bin/rar_one.rs"

[[bin]]
name = "rar-perf"
path = "src/bin/rar_perf.rs"

[features]
# Extract through the old path-based walk instead of folder handles.
path-walk = ["spike-safe-path/path-walk"]

[dependencies]
spike-safe-path.workspace = true
spike-names.workspace = true
zip.workspace = true
sevenz-rust2.workspace = true
unrar.workspace = true
rars = "0.12.0"
crc32fast.workspace = true
tar.workspace = true
zstd.workspace = true
flate2.workspace = true
tempfile.workspace = true
walkdir.workspace = true
anyhow.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"

[lints]
workspace = true
