[package]
name = "ng-probe"
description = "unrar-ng next to the probe's other RAR readers"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace: unrar-ng builds the same UnRAR C++ symbols as the
# `unrar` crate the probe uses, so the two cannot be linked side by side.
[workspace]

[dependencies]
unrar-ng = "0.7.7"
crc32fast = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
