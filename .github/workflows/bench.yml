# The spike's tests on three systems, and extraction measured on hosted
# runners: rars (folder handles, and the old path walk), UnRAR, and 7-Zip on
# Windows, all on the same generated folder.
name: Bench

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --release --locked

  real-archives:
    # Archives written by RAR itself (RAR for Linux 7.23 and 6.24, trial
    # versions from rarlab.com), so speed is measured on what users have,
    # not only on what rars writes (which stores BLAKE2sp hashes).
    name: Real RAR archives
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: RAR for Linux
        run: |
          for v in 723 624; do
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 20 --connect-timeout 30 -o /tmp/rar-$v.tar.gz https://www.rarlab.com/rar/rarlinux-x64-$v.tar.gz
            mkdir -p /opt/rar-$v && tar -xzf /tmp/rar-$v.tar.gz -C /opt/rar-$v --strip-components=1
          done
      - name: Pack
        run: |
          # The folder's text is the Cargo registry's sources: fetch them.
          cargo fetch --locked
          python3 scripts/bench-data.py "$RUNNER_TEMP/folder"
          mkdir real && cd "$RUNNER_TEMP/folder"
          /opt/rar-723/rar a -r -idq -ma5 -m3 "$GITHUB_WORKSPACE/real/rar7-default.rar" .
          /opt/rar-723/rar a -r -idq -ma5 -m3 -s "$GITHUB_WORKSPACE/real/rar7-solid.rar" .
          /opt/rar-723/rar a -r -idq -ma5 -m3 -s -htb "$GITHUB_WORKSPACE/real/rar7-solid-blake2.rar" .
          /opt/rar-624/rar a -r -idq -ma4 -m5 -s -mct+ "$GITHUB_WORKSPACE/real/rar6-rar4-ppmd.rar" .
          python3 -c "import pathlib,sys; print(sum(p.stat().st_size for p in pathlib.Path(sys.argv[1]).rglob('*') if p.is_file()))" . > "$GITHUB_WORKSPACE/real/unpacked.txt"
          ls -l "$GITHUB_WORKSPACE/real"
      - uses: actions/upload-artifact@v4
        with:
          name: real-archives
          path: real/
          retention-days: 3

  bench:
    name: Bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: real-archives
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (folder handles, and the old path walk)
        run: |
          cargo build --release --locked -p spike-probe
          cargo build --release --locked -p spike-probe --features path-walk --target-dir target/pathwalk
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          mkdir -p bin
          cp "target/release/rar-perf$ext" "bin/rar-perf$ext"
          cp "target/pathwalk/release/rar-perf$ext" "bin/rar-perf-pathwalk$ext"
          if [ "$RUNNER_OS" = Windows ] && [ -f "/c/Program Files/7-Zip/7z.exe" ]; then
            cp "/c/Program Files/7-Zip/7z.exe" "/c/Program Files/7-Zip/7z.dll" bin/
            echo "SEVENZIP=1" >> "$GITHUB_ENV"
            # Which machine 7-Zip is built for (x64 runs emulated on ARM64).
            python -c "import struct,sys; d=open(sys.argv[1],'rb').read(); o=struct.unpack_from('<I',d,0x3c)[0]; print('7z.exe machine', hex(struct.unpack_from('<H',d,o+4)[0]), {0x8664:'x64',0xaa64:'arm64',0x14c:'x86'}.get(struct.unpack_from('<H',d,o+4)[0]))" bin/7z.exe
          fi
          echo "PY=$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
          uname -a
      - name: Make the folder and the archives
        run: |
          "$PY" scripts/bench-data.py "$RUNNER_TEMP/folder"
          echo "UNPACKED=$("$PY" -c "import pathlib,sys; print(sum(p.stat().st_size for p in pathlib.Path(sys.argv[1]).rglob('*') if p.is_file()))" "$RUNNER_TEMP/folder")" >> "$GITHUB_ENV"
          bin/rar-perf make "$RUNNER_TEMP/folder" "$RUNNER_TEMP/rar5.rar"
          bin/rar-perf make4lz "$RUNNER_TEMP/folder" "$RUNNER_TEMP/rar4-lz.rar"
          ls -l "$RUNNER_TEMP"/*.rar
      - uses: actions/download-artifact@v4
        with:
          name: real-archives
          path: real
      - name: Time the archives RAR wrote
        env:
          BENCH_TITLE: "### ${{ matrix.os }}, archives written by RAR"
        run: |
          ways=(
            "rars decode=bin/rar-perf read {a} sink-handle"
            "UnRAR decode=bin/rar-perf read {a} unrar-test"
            "rars extract=bin/rar-perf read {a} rars-disk-pipelined"
            "UnRAR extract=bin/rar-perf read {a} unrar-pipe-disk"
          )
          if [ -n "${SEVENZIP:-}" ]; then
            ways+=("7-Zip test=bin/7z.exe t {a}" "7-Zip extract=bin/7z.exe x -y -o{out} {a}")
          fi
          "$PY" scripts/bench-run.py "$(cat real/unpacked.txt)" real/*.rar -- "${ways[@]}"
      - name: Defender state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object AMServiceEnabled,RealTimeProtectionEnabled,OnAccessProtectionEnabled | Format-List
          (Get-MpPreference).ExclusionPath
      - name: Time
        env:
          BENCH_TITLE: "### ${{ matrix.os }}"
        run: bash scripts/bench-ci.sh
      - name: Turn Defender real-time protection on, without the runner's exclusions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Hosted runners exclude whole drives (C:\ and D:\), so Defender
          # scans nothing there until the exclusions go.
          $excluded = (Get-MpPreference).ExclusionPath
          if ($excluded) { Remove-MpPreference -ExclusionPath $excluded }
          Set-MpPreference -DisableRealtimeMonitoring $false
          Start-Sleep -Seconds 10
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled,OnAccessProtectionEnabled | Format-List
          "Exclusions left: $((Get-MpPreference).ExclusionPath)"
      - name: Time with Defender on
        if: runner.os == 'Windows'
        env:
          BENCH_TITLE: "### ${{ matrix.os }}, Defender real-time protection on, no exclusions"
        run: bash scripts/bench-ci.sh
